name: Build Chamelon Browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Download and verify official Tor Expert Bundle
        shell: pwsh
        run: ./scripts/prepare-tor.ps1
      - name: Build Windows packages
        run: npm run dist
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Chamelon-Browser-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14